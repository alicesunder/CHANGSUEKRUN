<ellipse cx="230" cy="133" rx="9" ry="4.5" fill="#C58A32" transform="rotate(12 230 133)"/>
<g class="eye"><circle cx="170" cy="152" r="9.5" fill="#2B1B14"/><circle cx="173.5" cy="148.5" r="3.2" fill="#fff"/></g>
<g class="eye"><circle cx="230" cy="152" r="9.5" fill="#2B1B14"/><circle cx="233.5" cy="148.5" r="3.2" fill="#fff"/></g>
</g>

<g fill="#F2667A">
<g transform="translate(325 150)"><path class="heart" d="M0 8C-14-2-10-14 0-7C10-14 14-2 0 8Z"/></g>
<g transform="translate(75 140)"><path class="heart" style="animation-delay:1.1s" d="M0 8C-14-2-10-14 0-7C10-14 14-2 0 8Z"/></g>
<g transform="translate(345 105)"><path class="heart" style="animation-delay:2.2s" d="M0 8C-14-2-10-14 0-7C10-14 14-2 0 8Z"/></g>
</g>
</svg>
