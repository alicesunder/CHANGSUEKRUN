<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="หมาพันธุ์ลาบราดอร์สีทองกำลังแลบลิ้นและกระดิกหาง" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Labrador Retriever</title>
<defs>
<linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEC572"/><stop offset="1" stop-color="#D79F47"/></linearGradient>
<linearGradient id="fur2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9A04A"/><stop offset="1" stop-color="#BF8530"/></linearGradient>
</defs>
<style>
#tail{transform-origin:272px 352px;animation:wag .45s ease-in-out infinite alternate}
#body{transform-origin:200px 400px;animation:breathe 3.2s ease-in-out infinite}
#head{transform-origin:200px 240px;animation:head 7s ease-in-out infinite}
#earL{transform-origin:142px 115px;animation:earL 2.4s ease-in-out infinite alternate}
#earR{transform-origin:258px 115px;animation:earR 2.4s ease-in-out infinite alternate}
#tag{transform-origin:200px 268px;animation:swing 2.4s ease-in-out infinite alternate}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
#tongue{transform-box:fill-box;transform-origin:50% 0;animation:pant .55s ease-in-out infinite alternate}
.heart{transform-box:fill-box;transform-origin:center;opacity:0;animation:rise 3.3s ease-out infinite}
@keyframes wag{from{transform:rotate(-16deg)}to{transform:rotate(18deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}
@keyframes head{0%,100%{transform:rotate(-2deg) translateY(0)}30%{transform:rotate(2deg) translateY(-3px)}60%{transform:rotate(-2deg) translateY(0)}75%,88%{transform:rotate(9deg) translateY(-2px)}}
@keyframes earL{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes earR{from{transform:rotate(4deg)}to{transform:rotate(-5deg)}}
@keyframes swing{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes pant{from{transform:scaleY(1)}to{transform:scaleY(1.14)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-60px) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.heart{opacity:0}}
</style>

<ellipse cx="200" cy="408" rx="125" ry="13" fill="#000" opacity=".12"/>

