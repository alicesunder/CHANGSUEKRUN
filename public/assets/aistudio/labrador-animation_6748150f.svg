<ellipse cx="200" cy="206" rx="46" ry="36" fill="#F6D994"/>
<g fill="#2B2220" opacity=".35"><circle cx="176" cy="212" r="1.8"/><circle cx="184" cy="218" r="1.8"/><circle cx="224" cy="212" r="1.8"/><circle cx="216" cy="218" r="1.8"/></g>
<path id="tongue" d="M187 222Q187 264 200 264Q213 264 213 222Z" fill="#F27C8C"/>
<path d="M200 230V252" stroke="#D9566B" stroke-width="2" stroke-linecap="round"/>
<path d="M200 208V217M200 217Q186 230 171 217M200 217Q214 230 229 217" fill="none" stroke="#2B2220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 184Q200 170 220 184Q218 204 200 208Q182 204 180 184Z" fill="#2B2220"/>
<ellipse cx="193" cy="181" rx="6" ry="2.5" fill="#fff" opacity=".35"/>
