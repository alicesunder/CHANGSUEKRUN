<ellipse cx="230" cy="398" rx="26" ry="13" fill="#F3D08A"/>
<path d="M163 391v9M177 391v9M223 391v9M237 391v9" stroke="#B97A25" stroke-width="2" stroke-linecap="round"/>
</g>

<path d="M142 240Q200 268 258 240L260 256Q200 286 140 256Z" fill="#D64545"/>
<g id="tag"><path d="M200 266V276" stroke="#C99A00" stroke-width="2"/><circle cx="200" cy="286" r="11" fill="#F4C430" stroke="#C99A00" stroke-width="2"/><circle cx="200" cy="286" r="3" fill="#C99A00"/></g>

<g id="head">
<path id="earL" d="M142 112Q96 118 98 198Q102 238 138 222Q152 176 154 128Z" fill="url(#fur2)"/>
<path id="earR" d="M258 112Q304 118 302 198Q298 238 262 222Q248 176 246 128Z" fill="url(#fur2)"/>
<ellipse cx="200" cy="170" rx="78" ry="72" fill="url(#fur)"/>
<ellipse cx="143" cy="192" rx="11" ry="7" fill="#F08A7A" opacity=".3"/>
